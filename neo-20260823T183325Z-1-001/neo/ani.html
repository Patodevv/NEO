<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>NEO</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: transparent;
    overflow: hidden;
  }
  .stage {
    height: 100vh;
    position: relative;
    overflow: hidden;
    background: transparent;
  }
  .split-half {
    position: absolute;
    left: 0;
    right: 0;
    height: 50vh;
    background: #000;
    z-index: 1;
    transition: transform 0.58s cubic-bezier(.22,1,.36,1);
    will-change: transform;
  }
  .split-half.top {
    top: 0;
  }
  .split-half.bottom {
    bottom: 0;
  }
  .stage.open .split-half.top {
    transform: translateY(-102%);
  }
  .stage.open .split-half.bottom {
    transform: translateY(102%);
  }
  .stage.open .logo {
    opacity: 0;
    transition: opacity 0.08s linear;
  }
  .logo {
    --full-w: min(34vw, 400px);
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: calc(var(--full-w) * 0.317384);
    height: calc(var(--full-w) * 0.311802);
    overflow: hidden;
    z-index: 3;
    transition: width 0.5s cubic-bezier(.22,1,.36,1);
  }
  .logo::after {
    content: "";
    position: absolute;
    inset: -18px;
    background: #000;
    transform: scaleX(0);
    transform-origin: left center;
    z-index: 2;
  }
  .logo.erase::after {
    animation: logo-erase 0.36s linear forwards;
  }
  .logo.reveal {
    width: var(--full-w);
  }
  .logo svg {
    display: block;
    width: var(--full-w);
    height: calc(var(--full-w) * 0.311802);
  }
  #letter-n {
    opacity: 0;
    transform: scale(0.97);
    transform-box: fill-box;
    transform-origin: center;
    animation: n-in 0.38s cubic-bezier(.22,1,.36,1) forwards;
    animation-delay: 0.05s;
  }
  @keyframes n-in {
    to { opacity: 1; transform: scale(1); }
  }
  #group-eo {
    opacity: 0;
    transition: opacity 0.32s ease 0.04s;
  }
  #group-eo.show {
    opacity: 1;
  }
  .intro-comet {
    position: absolute;
    left: 0;
    top: calc(50% - 54px);
    width: 620px;
    height: 116px;
    pointer-events: none;
    opacity: 0;
    z-index: 4;
    transform: translate3d(-760px, 0, 0) scale(2.35);
    transform-origin: center;
    will-change: transform, opacity;
  }
  .stage.shoot .intro-comet {
    opacity: 1;
    animation: intro-comet-pass 0.32s linear forwards;
  }
  .burst-trail {
    position: absolute;
    left: 0;
    top: 54px;
    width: 540px;
    height: 16px;
    border-radius: 999px;
    background: #071bbd;
    box-shadow: 0 0 7px rgba(7, 27, 189, .5);
    transform-origin: right center;
  }
  .stage.shoot .burst-trail {
    animation: intro-trail-wiggle 0.18s ease-in-out infinite alternate;
  }
  .burst-trail::before,
  .burst-trail::after {
    content: "";
    position: absolute;
    left: 38px;
    width: 360px;
    height: 12px;
    border-radius: 999px;
    background: #1230ff;
    transform-origin: right center;
  }
  .burst-trail::before {
    top: -20px;
    transform: skewX(-28deg);
  }
  .burst-trail::after {
    top: 20px;
    transform: skewX(28deg);
  }
  .burst-trail-2 {
    left: 58px;
    top: 47px;
    width: 390px;
    height: 11px;
    background: #2f56ff;
    box-shadow: none;
    transform: skewX(-18deg);
  }
  .stage.shoot .burst-trail::before {
    animation: intro-trail-upper 0.2s ease-in-out infinite alternate;
  }
  .stage.shoot .burst-trail::after {
    animation: intro-trail-lower 0.2s ease-in-out infinite alternate;
  }
  .stage.shoot .burst-trail-2 {
    animation: intro-trail-middle 0.16s ease-in-out infinite alternate;
  }
  .burst-pop {
    position: absolute;
    right: 72px;
    top: 40px;
    width: 28px;
    height: 9px;
    border: 1px solid #1230ff;
    border-radius: 999px;
    background: #2f56ff;
    opacity: 0;
    transform-origin: center;
  }
  .burst-pop-2 {
    right: 128px;
    top: 24px;
    width: 22px;
    height: 8px;
  }
  .burst-pop-3 {
    right: 150px;
    top: 70px;
    width: 24px;
    height: 8px;
  }
  .stage.shoot .burst-pop {
    animation: intro-pop 0.34s ease-out infinite;
  }
  .stage.shoot .burst-pop-2 {
    animation-delay: 0.07s;
  }
  .stage.shoot .burst-pop-3 {
    animation-delay: 0.14s;
  }
  .burst-star {
    position: absolute;
    right: 0;
    top: 16px;
    width: 94px;
    height: 94px;
    overflow: visible;
    animation: intro-star-spin 0.32s linear forwards;
    filter: drop-shadow(0 0 10px rgba(18, 48, 255, .62));
  }
  .burst-star-shadow {
    fill: #06116e;
    stroke: #06116e;
    stroke-width: 12;
    stroke-linejoin: round;
    stroke-linecap: round;
  }
  .burst-star-core {
    fill: #1230ff;
    stroke: #e9eeff;
    stroke-width: 9;
    stroke-linejoin: round;
    stroke-linecap: round;
  }
  .burst-star-center {
    fill: #ffffff;
    stroke: #8da2ff;
    stroke-width: 6;
    stroke-linejoin: round;
    stroke-linecap: round;
  }
  .star-spark {
    position: absolute;
    right: 18px;
    top: 52px;
    width: 20px;
    height: 7px;
    border: 1px solid #e9eeff;
    border-radius: 999px;
    background: #1230ff;
    opacity: 0;
    z-index: 6;
    transform-origin: center;
  }
  .star-spark-2 {
    right: 28px;
    top: 28px;
    width: 16px;
    height: 6px;
  }
  .star-spark-3 {
    right: 42px;
    top: 78px;
    width: 18px;
    height: 6px;
  }
  .star-spark-4 {
    right: 72px;
    top: 46px;
    width: 14px;
    height: 6px;
  }
  .stage.shoot .star-spark {
    animation: star-spark-fly 0.28s ease-out infinite;
  }
  .stage.shoot .star-spark-2 {
    animation-delay: .04s;
  }
  .stage.shoot .star-spark-3 {
    animation-delay: .09s;
  }
  .stage.shoot .star-spark-4 {
    animation-delay: .13s;
  }
  @keyframes logo-erase {
    to { transform: scaleX(1); }
  }
  @keyframes intro-comet-pass {
    0% { transform: translate3d(-760px, 0, 0) scale(2.35); opacity: 1; }
    88% { opacity: 1; }
    100% { transform: translate3d(calc(100vw + 220px), 0, 0) scale(2.35); opacity: 0; }
  }
  @keyframes intro-star-spin {
    to { transform: rotate(360deg); }
  }
  @keyframes intro-trail-wiggle {
    from { transform: translate3d(-10px, -2px, 0) skewX(-4deg) scaleX(1.02); }
    to { transform: translate3d(10px, 3px, 0) skewX(5deg) scaleX(.94); }
  }
  @keyframes intro-trail-upper {
    from { transform: translate3d(-14px, -4px, 0) skewX(-32deg) scaleX(1.02); }
    to { transform: translate3d(12px, 5px, 0) skewX(-20deg) scaleX(.92); }
  }
  @keyframes intro-trail-lower {
    from { transform: translate3d(12px, 4px, 0) skewX(32deg) scaleX(.94); }
    to { transform: translate3d(-14px, -5px, 0) skewX(20deg) scaleX(1.02); }
  }
  @keyframes intro-trail-middle {
    from { transform: translate3d(-8px, 4px, 0) skewX(-22deg) scaleX(1.01); }
    to { transform: translate3d(12px, -4px, 0) skewX(-10deg) scaleX(.91); }
  }
  @keyframes intro-pop {
    0% { opacity: 0; transform: translate3d(0, 0, 0) scale(.55) rotate(0deg); }
    28% { opacity: 1; }
    100% { opacity: 0; transform: translate3d(-52px, -16px, 0) scale(1.05) rotate(-10deg); }
  }
  @keyframes star-spark-fly {
    0% { opacity: 0; transform: translate3d(0, 0, 0) scale(.45) rotate(0deg); }
    24% { opacity: 1; }
    100% { opacity: 0; transform: translate3d(-64px, -24px, 0) scale(1.1) rotate(-18deg); }
  }
  @media (max-width: 560px) {
    .logo {
      --full-w: min(68vw, 330px);
    }
    .intro-comet {
      top: calc(50% - 48px);
      transform: translate3d(-560px, 0, 0) scale(1.45);
    }
    .stage.shoot .intro-comet {
      animation-name: intro-comet-pass-mobile;
    }
    @keyframes intro-comet-pass-mobile {
      0% { transform: translate3d(-560px, 0, 0) scale(1.45); opacity: 1; }
      88% { opacity: 1; }
      100% { transform: translate3d(calc(100vw + 130px), 0, 0) scale(1.45); opacity: 0; }
    }
  }
</style>
</head>
<body>

</div>
<script>
  const stage = document.getElementById('stage');
  const logo = document.getElementById('logo');
  const group = document.getElementById('group-eo');
  const parentCurtain = new URLSearchParams(window.location.search).get('parent-curtain') === '1';

  setTimeout(() => {
    logo.classList.add('reveal');
    group.classList.add('show');
  }, 260);

  setTimeout(() => {
    stage.classList.add('shoot');
    logo.classList.add('erase');
  }, 980);

  setTimeout(() => {
    if (!parentCurtain) window.parent.postMessage({ type: 'neo-intro-open' }, '*');
  }, 1040);

  setTimeout(() => {
    if (!parentCurtain) stage.classList.add('open');
  }, 1140);

  setTimeout(() => {
    window.parent.postMessage({ type: 'neo-intro-star-done' }, '*');
    if (parentCurtain) window.parent.postMessage({ type: 'neo-intro-parent-curtain' }, '*');
  }, 1320);
</script>
