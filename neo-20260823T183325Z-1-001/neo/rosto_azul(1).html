<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Rosto Azul Animado</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  svg {
    width: 320px;
    height: 260px;
    display: block;
  }
  .part {
    fill: #0090FF;
  }
</style>
</head>
<body>

<svg viewBox="0 0 300 220" xmlns="http://www.w3.org/2000/svg">
  <!-- Olho esquerdo -->
  <rect class="part" id="eyeLeft" x="95" y="70" width="30" height="60" rx="15" ry="15"/>
  <!-- Olho direito (retângulo, usado enquanto aberto) -->
  <rect class="part" id="eyeRight" x="175" y="70" width="30" height="60" rx="15" ry="15"/>
  <!-- Curva de "piscadinha" cartoon para o olho direito fechado -->
  <path id="eyeRightWink" d="M 175 100 Q 190 84 205 100" stroke="#0090FF" stroke-width="10" stroke-linecap="round" fill="none" opacity="0"/>
  <!-- Boca -->
  <path id="mouth" d="M 128 150 L 172 150" stroke="#0090FF" stroke-width="22" stroke-linecap="round" fill="none"/>
</svg>

<script>
  const eyeLeft = document.getElementById('eyeLeft');
  const eyeRight = document.getElementById('eyeRight');
  const eyeRightWink = document.getElementById('eyeRightWink');
  const mouth = document.getElementById('mouth');

  // Parâmetros originais dos olhos
  const eyeW = 30, eyeH = 60, eyeRx = 15;
  const eyeLeftX = 95, eyeRightX = 175;
  const eyeCenterY = 100; // centro vertical do olho (70 + 60/2)

  // Gera o path da boca como um traço de espessura constante (igual ao stroke-width fixo).
  // curveAmount = 0  -> linha reta horizontal (estado neutro, tipo "olho deitado")
  // curveAmount = 1  -> curva de sorriso (pontas pra cima, meio pra baixo)
  function mouthPath(curveAmount) {
    const leftX = 128, rightX = 172;
    const y0 = 150;
    const maxCurve = 22; // profundidade máxima do sorriso
    const cy = y0 + maxCurve * curveAmount;

    return `M ${leftX} ${y0} Q 150 ${cy} ${rightX} ${y0}`;
  }

  mouth.setAttribute('d', mouthPath(0));

  function setEyeHeight(el, x, scaleY) {
    // Comprime verticalmente mantendo o centro fixo
    const newH = Math.max(eyeH * scaleY, 6);
    const newY = eyeCenterY - newH / 2;
    const newRx = Math.min(eyeRx, newH / 2);
    el.setAttribute('height', newH);
    el.setAttribute('y', newY);
    el.setAttribute('rx', newRx);
    el.setAttribute('ry', newRx);
  }

  function easeInOutSine(t) {
    return -(Math.cos(Math.PI * t) - 1) / 2;
  }

  // Easing tipo "cartoon": acelera rápido e dá uma leve mola no final (overshoot)
  function easeOutBack(t) {
    const c1 = 1.70158;
    const c3 = c1 + 1;
    return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
  }

  const duration = 1800; // duração total do loop em ms (mais rápida)
  let startTime = null;

  // Marcos da timeline (proporção de 0 a 1 dentro do loop)
  const T = {
    eyesOpenStart: 0.10,
    eyesOpenEnd:   0.28,
    smileStart:    0.42,
    smileEnd:      0.60,
    winkStart:     0.75,
    winkClose:     0.80,   // fechamento rápido e estalado
    winkHold:      0.92,   // permanece na piscadinha
    loopEnd:       1.00
  };

  function animate(timestamp) {
    if (!startTime) startTime = timestamp;
    const elapsed = (timestamp - startTime) % duration;
    const t = elapsed / duration; // 0 a 1

    // --- Olho esquerdo: fechado -> abre -> permanece aberto o resto do tempo ---
    let leftScale;
    if (t < T.eyesOpenStart) {
      leftScale = 0.08;
    } else if (t < T.eyesOpenEnd) {
      const localT = (t - T.eyesOpenStart) / (T.eyesOpenEnd - T.eyesOpenStart);
      leftScale = 0.08 + easeInOutSine(localT) * 0.92;
    } else {
      leftScale = 1;
    }
    setEyeHeight(eyeLeft, eyeLeftX, leftScale);

    // --- Olho direito: fechado -> abre -> aberto -> pisca rápido e estalado -> fica na piscadinha ---
    let rightScale, winkOpacity;
    if (t < T.eyesOpenStart) {
      rightScale = 0.08;
      winkOpacity = 0;
    } else if (t < T.eyesOpenEnd) {
      const localT = (t - T.eyesOpenStart) / (T.eyesOpenEnd - T.eyesOpenStart);
      rightScale = 0.08 + easeInOutSine(localT) * 0.92;
      winkOpacity = 0;
    } else if (t < T.winkStart) {
      rightScale = 1;
      winkOpacity = 0;
    } else if (t < T.winkClose) {
      // Fechamento rápido e com um leve "estalo" (overshoot), estilo cartoon
      const localT = (t - T.winkStart) / (T.winkClose - T.winkStart);
      const eased = easeOutBack(localT);
      rightScale = Math.max(1 - eased * 1.05, 0);
      winkOpacity = Math.min(localT * 1.6, 1);
    } else {
      rightScale = 0;
      winkOpacity = 1;
    }

    eyeRight.setAttribute('opacity', 1 - winkOpacity);
    if (rightScale > 0) setEyeHeight(eyeRight, eyeRightX, rightScale);
    eyeRightWink.setAttribute('opacity', winkOpacity);

    // --- Boca: neutra (reta) -> abre suavemente em sorriso -> permanece sorrindo até o fim ---
    let curveAmount;
    if (t < T.smileStart) {
      curveAmount = 0;
    } else if (t < T.smileEnd) {
      const localT = (t - T.smileStart) / (T.smileEnd - T.smileStart);
      curveAmount = easeInOutSine(localT);
    } else {
      curveAmount = 1;
    }

    mouth.setAttribute('d', mouthPath(curveAmount));

    requestAnimationFrame(animate);
  }

  requestAnimationFrame(animate);
</script>

</body>
</html>
